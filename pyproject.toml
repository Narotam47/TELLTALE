[project]
name = "telltale"
version = "0.1.0"
description = "Competitive intelligence pipeline tracking hiring signals across Indian fintech companies"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.0",
]
llm = [
    "google-genai>=1.0",
    "groq>=0.11",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
telltale = "telltale.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Rules this codebase violates on purpose.
ignore = [
  # Adapters and LLM backends deliberately catch broad exceptions: one bad source
  # or one flaky provider must degrade that item, never abort the run.
  "BLE001",
  # dict(...) reads better than a literal in the kwargs-style config we build.
  "C408",
  # Scripts carry a shebang for documentation; they are run via `uv run python`.
  "EXE001",
  # ClassVar dicts (registries, profiles) are intentionally module-level mutables.
  "RUF012",
  # Guard clauses that raise ValueError on bad config are clearer than TypeError.
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# Tests unpack fixtures they do not always use, and shadow names for clarity.
"tests/*" = ["RUF059", "F841"]
"scripts/*" = ["RUF059"]
